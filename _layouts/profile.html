<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.name }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fcfcfa;
      --ink: #171a20;
      --muted: #5d6570;
      --accent: #1f4fbc;
      --award: #a87420;
      --hairline: #e3e5e8;
      --serif: "STIX Two Text", "Times New Roman", Georgia, serif;
      --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111318;
        --ink: #e4e6ea;
        --muted: #969ea9;
        --accent: #8aa6f5;
        --award: #d3a550;
        --hairline: #262a32;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover, a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ---- Header ---- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      margin-bottom: 3.2rem;
    }
    .site-header h1 {
      font-family: var(--serif);
      font-size: 2.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
      text-wrap: balance;
    }
    .role {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .site-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.1rem;
      margin-top: 0.9rem;
      font-family: var(--mono);
      font-size: 0.78rem;
    }
    .avatar {
      flex: 0 0 auto;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
    }
    @media (max-width: 480px) {
      .wrap { padding-top: 3rem; }
      .site-header { flex-direction: column-reverse; align-items: flex-start; gap: 1.2rem; }
      .avatar { width: 76px; height: 76px; }
    }

    /* ---- Body content ---- */
    .content p {
      margin-bottom: 1rem;
      max-width: 62ch;
    }
    .content p strong { font-weight: 600; }

    .interests-line {
      font-family: var(--serif);
      font-style: italic;
      color: var(--muted);
    }

    .content h2 {
      margin: 3rem 0 1.1rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--hairline);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---- News ---- */
    .news-list {
      list-style: none;
    }
    .news-list li {
      display: flex;
      gap: 1rem;
      align-items: baseline;
      margin-bottom: 0.55rem;
    }
    .news-date {
      flex: 0 0 5.2em;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .news-list strong { font-weight: 600; }

    /* ---- Publications ---- */
    .pub-list {
      list-style: none;
    }
    .pub-list li {
      margin-bottom: 1.55rem;
    }
    .pub-title {
      font-family: var(--serif);
      font-size: 1.06rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .pub-title a {
      color: var(--ink);
    }
    .pub-title a:hover, .pub-title a:focus-visible {
      color: var(--accent);
    }
    .pub-authors {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    em.pub-self {
      font-style: normal;
      font-weight: 600;
      color: var(--ink);
    }

    .pub-venue {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.9em;
      margin-top: 0.35rem;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .badge { color: var(--accent); font-weight: 500; }
    .badge-plain { color: var(--muted); font-weight: 400; }
    .award { color: var(--award); font-weight: 500; }

    .pub-links {
      display: inline-flex;
      gap: 0.7em;
      margin-left: 0.9em;
      font-family: var(--mono);
      font-size: 0.75rem;
      vertical-align: baseline;
    }
    .pub-links a::before { content: "["; }
    .pub-links a::after  { content: "]"; }
    .pub-links a:hover, .pub-links a:focus-visible {
      text-decoration: none;
    }
    .pub-links a:hover::before, .pub-links a:hover::after {
      color: var(--muted);
    }

    /* ---- Footer ---- */
    .site-footer {
      margin-top: 3.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--hairline);
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: no-preference) {
      a, .pub-title a { transition: color 0.12s ease; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div>
        <h1>{{ site.author.name }}</h1>
        <p class="role">{{ site.author.bio }}</p>
        <nav class="site-links" aria-label="Profile links">
          <a href="mailto:{{ site.author.email }}">email</a>
          <a href="{{ site.author.googlescholar }}">scholar</a>
          <a href="https://github.com/{{ site.author.github }}">github</a>
          <a href="https://x.com/{{ site.author.twitter }}">x</a>
          <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}">linkedin</a>
        </nav>
      </div>
      <img class="avatar" src="/images/{{ site.author.avatar }}" alt="Portrait of {{ site.author.name }}">
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      © 2026 {{ site.author.name }} · {{ site.author.location }}
    </footer>
  </div>
</body>
</html>
